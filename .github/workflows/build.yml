name: Build KootletLand Site

on:
  push:
    branches: [main]
    paths-ignore:
      - "kootletland-sync/**"
      - ".github/workflows/plugin-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SERVER_ADDRESS: play.kootletland.kal.how
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
