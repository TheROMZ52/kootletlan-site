name: Build KootletLand
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SERVER_ADDRESS: play.kootletland.kal.how
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -q -f kootletland-sync/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: kootletland-sync
          path: kootletland-sync/target/kootletland-sync-*.jar
