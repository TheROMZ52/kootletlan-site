name: Build KootletLandSync

on:
  push:
    branches: [main]
    paths:
      - "kootletland-sync/**"
      - ".github/workflows/plugin-build.yml"
  workflow_dispatch:

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -q -f kootletland-sync/pom.xml clean package
      - uses: actions/upload-artifact@v4
        with:
          name: KootletLandSync-1.4.0
          path: kootletland-sync/target/kootletland-sync-*.jar
          if-no-files-found: error
