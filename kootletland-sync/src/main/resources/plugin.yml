name: KootletLandSync
version: 1.2.0
main: ir.kootletland.sync.KootletLandSync
api-version: '1.21'
depend:
  - LuckPerms
description: Syncs Minecraft player data and LuckPerms ranks to KootletLand.
authors:
  - TheROMZ52
commands:
  kootletlandsync:
    description: KootletLandSync administration command
    usage: /kootletlandsync reload
    permission: kootletlandsync.reload
  link:
    description: Link your Minecraft account to KootletLand
    usage: /link <8-digit-code> | /link status | /link notifications | /link unlink
    permission: kootletlandsync.link
permissions:
  kootletlandsync.reload:
    description: Allows reloading KootletLandSync
    default: op
  kootletlandsync.link:
    description: Allows using the Minecraft account link command
    default: true
